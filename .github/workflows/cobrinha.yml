name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish contribution snake
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out normalization helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@b58af55b7df7854d355d1243ff3d4794692fa7e2 # v3.1.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7c3aed
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a78bfa

      - name: Keep short animations legible
        run: >-
          python3 scripts/normalize_snake_duration.py
          --minimum-ms 12000
          dist/github-contribution-grid-snake.svg
          dist/github-contribution-grid-snake-dark.svg

      - name: Generate public annual contribution history
        run: >-
          python3 scripts/generate_contribution_history.py
          --username "${{ github.repository_owner }}"
          --start-year 2021
          --seconds-per-year 6
          --output-dir dist

      - name: Publish generated SVG files
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
